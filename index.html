
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-4 p-3">

        <h1 class="text-center text-primary mb-4">
            Student Management CRUD
        </h1>

        <!-- Student Form -->
        <div class="card shadow-sm border-0 p-4 mb-4">

            <form id="studentsForm">

                <input id="editStatus" type="hidden" value="">

                <div class="row g-3">

                    <div class="col-lg-3">
                        <input id="studentid" type="text"
                            class="form-control"
                            placeholder="Student ID" required>
                    </div>

                    <div class="col-lg-3">
                        <input id="studentName" type="text"
                            class="form-control"
                            placeholder="Student Name" required>
                    </div>

                    <div class="col-lg-3">
                        <select id="course" class="form-select" required>
                            <option value="" selected disabled>
                                Select Course
                            </option>
                            <option value="BCA">BCA</option>
                            <option value="BSc Computer Science">
                                BSc Computer Science
                            </option>
                            <option value="BCom">BCom</option>
                            <option value="BBA">BBA</option>
                            <option value="MCA">MCA</option>
                        </select>
                    </div>

                    <div class="col-lg-3">
                        <select id="department" class="form-select" required>
                            <option value="" selected disabled>
                                Select Department
                            </option>
                            <option value="Computer Science">
                                Computer Science
                            </option>
                            <option value="Commerce">Commerce</option>
                            <option value="Management">Management</option>
                        </select>
                    </div>

                    <div class="col-lg-3">
                        <input id="marks" type="number"
                            class="form-control"
                            placeholder="Marks (0-100)"
                            min="0" max="100" required>
                    </div>

                    <div class="col-lg-3">
                        <button type="submit"
                            class="btn btn-success w-100">
                            Add Student
                        </button>
                    </div>

                </div>

            </form>

        </div>

        <!-- Search and Filter -->
        <div class="row g-3 mb-4">

            <div class="col-md-6">
                <input id="searchStudent" type="text"
                    class="form-control"
                    placeholder="Search Student Name">
            </div>

            <div class="col-md-6">
                <select id="filterCourse" class="form-select">
                    <option value="all">All Courses</option>
                    <option value="BCA">BCA</option>
                    <option value="BSc Computer Science">
                        BSc Computer Science
                    </option>
                    <option value="BCom">BCom</option>
                    <option value="BBA">BBA</option>
                    <option value="MCA">MCA</option>
                </select>
            </div>

        </div>

        <!-- Student Table -->
        <div class="card shadow-sm border-0">
            <div class="card-body">

                <h5 class="mb-3">Student Records</h5>

                <div class="table-responsive">

                    <table class="table table-bordered table-striped table-hover align-middle">

                        <thead class="table-dark text-center">
                            <tr>
                                <th>#</th>
                                <th>Student ID</th>
                                <th>Student Name</th>
                                <th>Course</th>
                                <th>Department</th>
                                <th>Marks</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="tableBody"></tbody>

                    </table>

                </div>

            </div>
        </div>

    </div>

    <script src="./main.js"></script>

</body>
</html>
